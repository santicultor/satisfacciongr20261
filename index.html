<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Cultura 2026-1 — Unisabana</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#00205B;--blue:#00387B;--light:#f4f7ff;--border:#e2e8f5;--text:#1a2340;--muted:#6b7fa8;--gold:#e8c84a;--green:#16a34a;--red:#ef4444;--orange:#d97706;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--light);color:var(--text);min-height:100vh}

/* ── TOPBAR ── */
.topbar{background:var(--navy);padding:0 28px;display:flex;align-items:stretch;justify-content:space-between;position:sticky;top:0;z-index:100;min-height:54px}
.tb-brand{display:flex;align-items:center;gap:10px}
.tb-brand h1{font-family:'Playfair Display',serif;font-size:16px;color:#fff;font-weight:700;white-space:nowrap}
.tb-brand p{font-size:11px;color:rgba(255,255,255,0.4);border-left:1px solid rgba(255,255,255,0.15);padding-left:10px;margin-left:4px;white-space:nowrap}
.grupo-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.1);border-left:1px solid rgba(255,255,255,0.1);padding:0 20px;cursor:default}
.grupo-pill-em{font-size:18px}
.grupo-pill-name{font-size:13px;font-weight:600;color:#fff}
.grupo-pill-n{font-size:11px;color:rgba(255,255,255,0.45);padding-left:8px;border-left:1px solid rgba(255,255,255,0.15);margin-left:4px}

/* ── FILTERBAR ── */
.filterbar{background:#fff;border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;position:sticky;top:54px;z-index:99}
.fl{font-size:11px;color:var(--muted);font-weight:500;white-space:nowrap;margin-right:3px}
.gb{background:var(--light);border:1.5px solid var(--border);border-radius:100px;padding:4px 10px;font-size:11px;font-family:'Outfit',sans-serif;color:var(--muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.gb:hover{border-color:var(--blue);color:var(--navy)}
.gb.active{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}

/* ── LAYOUT ── */
.main{padding:20px 24px;max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.row{display:grid;gap:16px}
.row.cols4{grid-template-columns:repeat(4,1fr)}
.row.cols3{grid-template-columns:repeat(3,1fr)}
.row.cols2{grid-template-columns:1fr 1fr}
.row.cols21{grid-template-columns:2fr 1fr}
.row.cols12{grid-template-columns:1fr 2fr}

/* ── CARDS ── */
.card{background:#fff;border:1px solid var(--border);border-radius:13px;padding:18px 20px}
.card-title{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.card-title-lg{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;color:var(--navy);margin-bottom:14px}

/* ── MAESTRO ── */
.maestro-card{background:linear-gradient(135deg,#00205B 0%,#00387B 100%);border-radius:13px;padding:18px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.maestro-av{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;border:2px solid rgba(255,255,255,0.25)}
.maestro-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:#fff}
.maestro-sub{font-size:12px;color:rgba(255,255,255,0.5);margin-top:2px}
.maestro-kpis{margin-left:auto;display:flex;gap:18px}
.mk{text-align:center}
.mk-val{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#fff;line-height:1}
.mk-lbl{font-size:10px;color:rgba(255,255,255,0.45);margin-top:3px;line-height:1.3}

/* ── KPI ── */
.kpi{background:#fff;border:1px solid var(--border);border-radius:13px;padding:16px 18px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--navy)}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between}
.kpi-val{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;line-height:1}
.kpi-icon{font-size:22px;opacity:.6}
.kpi-label{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:4px}

/* ── STAR BAR ── */
.si{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--light)}
.si:last-child{border-bottom:none}
.sn{font-size:13px;color:var(--text);flex:1;line-height:1.3}
.st{flex:1;max-width:100px;height:5px;background:var(--light);border-radius:3px;overflow:hidden;flex-shrink:0}
.sf{height:100%;border-radius:3px;background:var(--gold)}
.sv{font-size:13px;font-weight:700;width:28px;text-align:right;flex-shrink:0}
.sm{font-size:10px;color:var(--muted)}

/* ── SAT ── */
.sat-section-title{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 7px}
.sat-section-title:first-child{margin-top:0}
.sat-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.se{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.sl{font-size:12px;color:var(--text);flex:1}
.sb{width:70px;height:5px;background:var(--light);border-radius:3px;overflow:hidden;flex-shrink:0}
.sbf{height:100%;border-radius:3px;background:var(--blue)}
.sn2{font-size:11px;color:var(--muted);width:18px;text-align:right}

/* ── CANAL ── */
.cp{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--light);border-radius:9px;margin-bottom:7px}
.cp:last-child{margin-bottom:0}
.ci{font-size:18px}
.cn{font-size:13px;font-weight:500;color:var(--text);flex:1}
.cb{width:60px;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.cbf{height:100%;border-radius:3px;background:var(--navy)}
.cpct{font-size:13px;font-weight:700;color:var(--navy);min-width:30px;text-align:right}

/* ── RANKING ── */
.gr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--light)}
.gr:last-child{border-bottom:none}
.gem{font-size:14px;width:18px;text-align:center;flex-shrink:0}
.gname{font-size:12px;color:var(--text);flex:1;font-weight:500;line-height:1.2}
.gmae{font-size:10px;color:var(--muted);font-weight:400}
.gn2{font-size:10px;color:var(--muted);width:38px;text-align:center;flex-shrink:0}
.gsb{width:44px;height:4px;background:var(--light);border-radius:2px;overflow:hidden;flex-shrink:0}
.gsfill{height:100%;border-radius:2px;background:var(--navy)}
.gscore{font-size:13px;font-weight:700;width:30px;text-align:right;flex-shrink:0}

/* ── DESTACADOS ── */
.dest-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.dest-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px 16px;position:relative}
.dest-card::before{content:'"';position:absolute;top:6px;right:12px;font-size:36px;color:var(--border);font-family:'Playfair Display',serif;line-height:1}
.dest-grupo{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.dest-text{font-size:13px;color:var(--text);line-height:1.6;font-style:italic}

/* ── TEMAS ── */
.tema-chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--border);border-radius:100px;padding:4px 11px;margin:3px;font-size:12px;color:var(--text)}
.tc-n{font-size:10px;font-weight:700;color:#fff;border-radius:100px;padding:1px 6px}

/* ── CONCLUSIONES ── */
.conc-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.conc-card{border-radius:11px;padding:14px 16px}
.conc-card.green{background:#f0fdf4;border:1px solid #bbf7d0}
.conc-card.amber{background:#fffbeb;border:1px solid #fde68a}
.conc-ct{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:9px}
.conc-card.green .conc-ct{color:#15803d}
.conc-card.amber .conc-ct{color:#b45309}
.conc-item{display:flex;align-items:flex-start;gap:7px;margin-bottom:7px;font-size:13px;line-height:1.55;color:var(--text)}
.conc-item:last-child{margin-bottom:0}
.conc-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:7px}
.green .conc-dot{background:#22c55e}
.amber .conc-dot{background:#f59e0b}
.acc-item{display:flex;align-items:flex-start;gap:10px;padding:9px 13px;background:#fff;border:1px solid var(--border);border-radius:9px;margin-bottom:7px;font-size:13px;line-height:1.5;color:var(--text)}
.acc-item:last-child{margin-bottom:0}
.acc-num{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}

/* ── SANTI ── */
.santi-header{background:linear-gradient(135deg,#00205B 0%,#003a7a 100%);border-radius:13px;padding:20px 24px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.santi-av{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,0.13);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;border:2px solid rgba(255,255,255,0.25)}
.santi-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:#fff}
.santi-sub{font-size:11px;color:rgba(255,255,255,0.5);margin-top:3px}
.santi-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);border-radius:100px;padding:4px 12px;font-size:11px;color:rgba(255,255,255,0.75);margin-top:8px}
.santi-stats{margin-left:auto;display:flex;gap:20px}
.sstat{text-align:center}
.sstat-val{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#fff}
.sstat-lbl{font-size:10px;color:rgba(255,255,255,0.45);margin-top:2px;line-height:1.3}
.santi-cg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.santi-card{background:#fff;border:1px solid var(--border);border-radius:11px;padding:14px 16px;position:relative}
.santi-card::before{content:'"';position:absolute;top:6px;right:12px;font-size:36px;color:var(--border);font-family:'Playfair Display',serif;line-height:1}
.santi-grupo{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.santi-text{font-size:13px;color:var(--text);line-height:1.65;font-style:italic}

/* ── VOCES ── */
.tab-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.tab-btn{background:var(--light);border:1.5px solid var(--border);border-radius:8px;padding:5px 12px;font-size:12px;font-family:'Outfit',sans-serif;color:var(--muted);cursor:pointer;transition:all .15s}
.tab-btn:hover{border-color:var(--blue);color:var(--navy)}
.tab-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}
.tc{display:none}.tc.active{display:block}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cc{background:var(--light);border:1px solid var(--border);border-radius:10px;padding:11px 13px}
.cg-grupo{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
.cg-text{font-size:13px;color:var(--text);line-height:1.6}
.more-btn{font-size:12px;color:var(--blue);cursor:pointer;margin-top:9px;text-align:center;padding:7px;background:#fff;border:1px solid var(--border);border-radius:8px;display:none}
.more-btn:hover{background:var(--light)}

/* ── ALERT BOX ── */
.alert-box{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:11px 14px}
.alert-box-t{font-size:12px;font-weight:600;color:#c2410c;margin-bottom:3px}
.alert-box-b{font-size:12px;color:#9a3412;line-height:1.5}

/* ── SCORES ROW (grupo detail) ── */
.conc-scores{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cscore{background:var(--light);border:1px solid var(--border);border-radius:9px;padding:9px 14px;text-align:center;flex:1;min-width:70px}
.cscore-val{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;line-height:1}
.cscore-lbl{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3}

/* ── COLORS ── */
.score-hi{color:var(--green)}.score-mid{color:var(--orange)}.score-lo{color:var(--red)}

/* ── SECTION DIVIDER ── */
.section-label{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.section-label h2{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--navy);white-space:nowrap}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

@media(max-width:1000px){.row.cols4{grid-template-columns:1fr 1fr}.row.cols3{grid-template-columns:1fr 1fr}.dest-grid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.row.cols4,.row.cols3,.row.cols2,.row.cols21,.row.cols12{grid-template-columns:1fr}.dest-grid,.santi-cg,.conc-grid,.cg{grid-template-columns:1fr}.maestro-kpis,.santi-stats{display:none}}
</style>
</head>

lso, \"Boost\" que nos da en la academia al ser no solo un lugar de descanso de la clase y desarollar una habilidad que involucra el manejo del cuerpo lleva a que seamos mas agiles, apartados del sedentarismo, llevandonos a ser sin darnos cuenta personas mas capaces, tranquilas y pilosas. Con un proceso firme y en su mayoria constante hace que al final del semestre o al inicio del proximo uno veaa cambios para bien en el bienestar de uno mismo, el estudiante que es capaz de apartar un espacio para cuidarse a si mismo y aprender sin presion academica.\n\nAtt. Esteban Pintor. \n\nPosdata: dejo mi nombre porque pusieron lo de los codigos mal, para algunos (no se si todos) tenemos ID's de 6 digitos no 7.", "otros": "", "sugerencias": "Primero quiero felicitar a Santiago Bedoya por su labor a pesar del poco tiempo que lleva, ha sido visble su aporte presente desde Saoko, al siempre estar pendiente, avisarnos sobre mas eventos,  y con el transporte en salidas, entre otros. Siento que para futuros semestres podemos contar mas con el equipo de bienestar en cuanto a grupos culturales para impulsar mas nuestro trabajo.\n\nAhorita mismo, el unico fallo claro que se me viene a la mente por parte de bienestar fue el no apoyarnos adecuadamente con el tema delrefrigerio en los eventos, aunque no parezca las presentaciones de asi sea 3 minutos son de muy alta intensidad y no acaba muy desgastado y deshitrado  con necesidad de recuperar energia a traves de proteina y carbohidratos."}, {"id": "24537.0", "grupo": "Tuna Masculina", "dir": {"d_puntualidad": 5.0, "d_comunicacion": 5.0, "d_relaciones": 5.0, "d_liderazgo": 5.0, "d_exigencia": 5.0, "d_conocimientos": 5.0, "d_metodologia": 5.0, "d_actitud": 5.0}, "practica": 4.0, "maestro": 4.0, "bien": {"b_instalaciones": 5.0, "b_implementos": 5.0, "b_dotacion": 4.0, "b_atencion": 5.0, "b_salidas": 5.0}, "canal": "WhatsApp", "mejora": "Ninguna,considero aue es un buen director", "cambio": "Horarios y fleibilidad", "otros": "", "sugerencias"     const row=(x,key,mx)=>`<div class="gr"><span class="gem">${GE[x.g]||'🎭'}</span><span class="gname">${gn(x.g)}<br><span class="gmae">${MAESTROS[x.g]||''}</span></span><span class="gn2">${x.n}</span><div class="gsb"><div class="gsfill" style="width:${(x[key]/mx)*100}%"></div></div><span class="gscore ${sc(x[key])}">${x[key].toFixed(1)}</span></div>`;
    html+=`<div><div class="section-label"><h2>Comparativa entre grupos</h2></div><div class="row cols2">
      <div class="card"><div class="card-title">Satisfacción con la práctica</div>${bPr.map(x=>row(x,'pr',mP)).join('')}</div>
      <div class="card"><div class="card-title">Satisfacción con el maestro/a</div>${bMa.map(x=>row(x,'ma',mM)).join('')}</div>
    </div></div>`;

    // Temas + alertas
    const bienScores=grupos.map(g=>{const gd=DATA.filter(d=>d.grupo===g);return{g,v:avg(gd.flatMap(d=>Object.values(d.bien).filter(Boolean)))};}).sort((a,b)=>a.v-b.v).slice(0,3);
    html+=`<div><div class="section-label"><h2>Temas recurrentes</h2></div>
      <div style="margin-bottom:12px">${TEMAS.map(t=>`<span class="tema-chip">${t.label}<span class="tc-n" style="background:${t.c}">${t.n}</span></span>`).join('')}</div>
      <div class="row cols3">${bienScores.map(o=>`<div class="alert-box"><div class="alert-box-t">${GE[o.g]||'🎭'} ${gn(o.g)}</div><div class="alert-box-b">Bienestar: <strong>${o.v.toFixed(2)}/5</strong> — revisar instalaciones y dotación.</div></div>`).join('')}</div>
    </div>`;
  }

  // ── CONCLUSIONES ──
  const gc=isAll?CONCLUSIONES.general:CONCLUSIONES.grupos[cg];
  if(gc){
    let concHtml='';
    if(!isAll&&gc.scores){
      concHtml+=`<div class="conc-scores">${[['practica','Práctica'],['maestro','Maestro/a'],['director','Director/a'],['bienestar','Bienestar']].map(([k,l])=>{const v=gc.scores[k];const col=v>=4.5?'#16a34a':v>=3.5?'#d97706':'#ef4444';return`<div class="cscore"><div class="cscore-val" style="color:${col}">${v.toFixed(1)}</div><div class="cscore-lbl">${l}</div></div>`;}).join('')}</div>`;
    }
    if(isAll){
      concHtml+=`<div class="conc-grid">
        <div class="conc-card green"><div class="conc-ct">✅ Fortalezas del semestre</div>${gc.fortalezas.map(f=>`<div class="conc-item"><div class="conc-dot"></div><div>${f}</div></div>`).join('')}</div>
        <div class="conc-card amber"><div class="conc-ct">⚡ Oportunidades de mejora</div>${gc.oportunidades.map(f=>`<div class="conc-item"><div class="conc-dot"></div><div>${f}</div></div>`).join('')}</div>
      </div>
      <div class="card-title" style="margin-bottom:10px">Acciones prioritarias para 2026-2</div>
      ${gc.acciones.map((a,i)=>`<div class="acc-item"><div class="acc-num">${i+1}</div><div>${a}</div></div>`).join('')}`;
    } else {
      concHtml+=`<div class="conc-grid">
        <div class="conc-card green"><div class="conc-ct">✅ Fortaleza</div><div class="conc-item"><div class="conc-dot"></div><div>${gc.fortaleza}</div></div></div>
        <div class="conc-card amber"><div class="conc-ct">⚡ Oportunidad</div><div class="conc-item"><div class="conc-dot"></div><div>${gc.oportunidad}</div></div></div>
      </div>
      <div class="card-title" style="margin-bottom:10px">Acciones para ${gn(cg)}</div>
      ${gc.acciones.map((a,i)=>`<div class="acc-item"><div class="acc-num">${i+1}</div><div>${a}</div></div>`).join('')}`;
    }
    html+=`<div><div class="section-label"><h2>Conclusiones y acciones</h2></div>${concHtml}</div>`;
  }

  // ── SANTIAGO (solo en Todos) ──
  if(isAll){
    html+=`<div><div class="section-label"><h2>Comentarios al Coordinador</h2></div>
      <div class="santi-header">
        <div class="santi-av">👤</div>
        <div><div class="santi-name">Santiago Bedoya</div><div class="santi-sub">Coordinador de Desarrollo Cultural · Bienestar y Experiencia del Estudiante</div><div class="santi-badge">⭐ ${SANTI_COMMENTS.length} menciones positivas de estudiantes</div></div>
        <div class="santi-stats">
          <div class="sstat"><div class="sstat-val">${SANTI_COMMENTS.length}</div><div class="sstat-lbl">Menciones<br>positivas</div></div>
          <div class="sstat"><div class="sstat-val">${[...new Set(SANTI_COMMENTS.map(c=>c.grupo))].length}</div><div class="sstat-lbl">Grupos<br>distintos</div></div>
        </div>
      </div>
      <div class="santi-cg">${SANTI_COMMENTS.map(c=>`<div class="santi-card"><div class="santi-grupo">${GE[c.grupo]||'🎭'} ${gn(c.grupo)}</div><div class="santi-text">${c.text}</div></div>`).join('')}</div>
    </div>`;
  }

  // ── VOCES ──
  html+=`<div><div class="section-label"><h2>Voces de los estudiantes</h2></div>
    <div class="tab-row">
      <button class="tab-btn active" onclick="showTab('mejora')">¿En qué puede mejorar?</button>
      <button class="tab-btn" onclick="showTab('cambio')">¿Qué cambiarías?</button>
      <button class="tab-btn" onclick="showTab('sugerencias')">Sugerencias a Bienestar</button>
      <button class="tab-btn" onclick="showTab('otros')">Nuevos grupos sugeridos</button>
    </div>
    <div class="tc active" id="tab-mejora"><div class="cg" id="c-mejora"></div><div class="more-btn" id="m-mejora" onclick="showMore('mejora')">Ver más</div></div>
    <div class="tc" id="tab-cambio"><div class="cg" id="c-cambio"></div><div class="more-btn" id="m-cambio" onclick="showMore('cambio')">Ver más</div></div>
    <div class="tc" id="tab-sugerencias"><div class="cg" id="c-sugerencias"></div><div class="more-btn" id="m-sugerencias" onclick="showMore('sugerencias')">Ver más</div></div>
    <div class="tc" id="tab-otros"><div class="cg" id="c-otros"></div><div class="more-btn" id="m-otros" onclick="showMore('otros')">Ver más</div></div>
  </div>`;

  // Render bienestar in 3rd card properly
  mc.innerHTML=html;

  // Fix bienestar card (replace sorted placeholder)
  const bienCard=mc.querySelectorAll('.card')[2];
  if(bienCard){
    const bienDiv=bienCard.querySelector('div[style*="margin-top:14px"]');
    if(bienDiv) bienDiv.innerHTML=`<div class="card-title">Bienestar — por servicio</div>${bA.map(o=>`<div class="si"><div class="sn">${o.l}</div><div class="st"><div class="sf" style="width:${(o.v/5)*100}%"></div></div><div class="sv ${sc(o.v)}">${o.v.toFixed(1)}</div><div class="sm">/5</div></div>`).join('')}`;
  }

  renderComments(fd);
}

function renderComments(fd){
  ['mejora','cambio','sugerencias','otros'].forEach(type=>{
    const items=fd.filter(d=>clean(d[type])).map(d=>({g:d.grupo,t:d[type].trim()}));
    const show=Math.min(cs[type],items.length);
    const c=document.getElementById('c-'+type);
    const btn=document.getElementById('m-'+type);
    if(!c||!btn) return;
    c.innerHTML=items.slice(0,show).map(o=>`<div class="cc"><div class="cg-grupo">${GE[o.g]||'🎭'} ${gn(o.g)}</div><div class="cg-text">${o.t.length>240?o.t.slice(0,240)+'…':o.t}</div></div>`).join('');
    if(items.length>show){btn.style.display='block';btn.textContent=`Ver más (${items.length-show} restantes)`;}
    else btn.style.display='none';
  });
}

function showMore(type){cs[type]+=8;renderComments(gf());}
function fg(g){
  cg=g;cs={mejora:6,cambio:6,sugerencias:6,otros:6};
  document.querySelectorAll('.gb').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes("'"+g+"'")));
  render();
}
function showTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick').includes("'"+tab+"'")));
  document.querySelectorAll('.tc').forEach(c=>c.classList.toggle('active',c.id==='tab-'+tab));
}
render();
</script>
</body>
</html>
